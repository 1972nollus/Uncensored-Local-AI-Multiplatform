name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get

      - name: Verify llamadart version
        run: |
          echo "=== llamadart dependencies ==="
          flutter pub deps | grep -i llama || true
          echo "=== pubspec.lock llamadart entries ==="
          grep -A 8 -B 2 "llamadart" pubspec.lock || true

      - name: Build iOS without signing
        run: |
          flutter build ios --release --no-codesign \
            --config-only
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r UncensoredLocalAI-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UncensoredLocalAI-iOS-unsigned
          path: UncensoredLocalAI-unsigned.ipa
          if-no-files-found: error
